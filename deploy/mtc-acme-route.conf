# Append ONLY this separate server block to the existing mounted config.
# Existing website server blocks remain unchanged.
# Replace MEDIDESK_HOST_GATEWAY with the inspected Docker network gateway address.
server {
    listen 80;
    server_name medidesk.57.131.145.168.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://MEDIDESK_HOST_GATEWAY:8080;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
