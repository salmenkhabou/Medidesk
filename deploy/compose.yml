name: medidesk
services:
  backend:
    image: ${BACKEND_IMAGE:?Set the immutable backend image digest}
    restart: unless-stopped
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Provision JWT_SECRET securely on the server}
      FRONTEND_URL: ${SITE_URL:?Set the public HTTPS origin}
      DB_PATH: /home/node/app/data/medidesk.sqlite
      TRUST_PROXY: 1
    volumes:
      - backend-data:/home/node/app/data
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    image: ${FRONTEND_IMAGE:?Set the immutable frontend image digest}
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging: *logging
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["8080:80", "8443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:?Set the public hostname without scheme}
      SITE_ORIGIN: ${SITE_URL:?Set the HTTPS origin including port 8443}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /srv/medidesk/certs:/etc/nginx/medidesk-certs:ro
      - /srv/medidesk/acme:/var/www/medidesk-acme:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
volumes:
  backend-data:
