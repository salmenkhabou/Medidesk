name: Release MediDesk
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated main revision to the configured production server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: medidesk-production-release
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Release only from main
        run: test "$GITHUB_REF" = refs/heads/main || { echo 'Run this workflow from main.' >&2; exit 1; }
  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.refs.outputs.backend }}
      frontend: ${{ steps.refs.outputs.frontend }}
      site_url: ${{ steps.public.outputs.site_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: public
        name: Validate public release configuration
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PRIVACY_OPERATOR: ${{ vars.PRIVACY_OPERATOR }}
          PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
          PRIVACY_POLICY_REVIEWED: ${{ vars.PRIVACY_POLICY_REVIEWED }}
        run: |
          node --input-type=module <<'JS'
          import {buildPublicConfig} from './frontend/src/site.js';
          import {appendFileSync} from 'node:fs';
          const config=buildPublicConfig(process.env);
          if(!config.siteUrl || new URL(config.siteUrl).port !== "8443") throw Error('Set SITE_URL to the final HTTPS origin on isolated port 8443 in repository Actions variables.');
          appendFileSync(process.env.GITHUB_OUTPUT,`site_url=${config.siteUrl}\n`);
          JS
      - id: images
        name: Registry image names
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          printf 'backend=ghcr.io/%s-backend\nfrontend=ghcr.io/%s-frontend\n' "$repository" "$repository" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        name: Publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: frontend
        name: Publish frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
          build-args: |
            SITE_URL=${{ steps.public.outputs.site_url }}
            PRIVACY_OPERATOR=${{ vars.PRIVACY_OPERATOR }}
            PRIVACY_EMAIL=${{ vars.PRIVACY_EMAIL }}
            PRIVACY_POLICY_REVIEWED=${{ vars.PRIVACY_POLICY_REVIEWED || 'false' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - id: refs
        name: Record immutable image digests
        env:
          BACKEND_NAME: ${{ steps.images.outputs.backend }}
          FRONTEND_NAME: ${{ steps.images.outputs.frontend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          printf 'backend=%s@%s\nfrontend=%s@%s\n' "$BACKEND_NAME" "$BACKEND_DIGEST" "$FRONTEND_NAME" "$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    if: inputs.deploy
    needs: publish
    environment:
      name: production
      url: ${{ needs.publish.outputs.site_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Upload and deploy the exact release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SITE_URL: ${{ needs.publish.outputs.site_url }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
        run: bash deploy/ssh-release.sh
