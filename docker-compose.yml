# Standalone local setup only. On the shared OVH host use deploy/update-practice.sh.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      FRONTEND_URL: ${FRONTEND_URL:?Set the public frontend origin}
      DB_PATH: /home/node/app/data/medidesk.sqlite
      TRUST_PROXY: 1
      HEALTH_DATA_KEY: ${HEALTH_DATA_KEY:?Set an independent retained 64-character hexadecimal key}
    volumes:
      - backend-data:/home/node/app/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-}
        PRIVACY_OPERATOR: ${PRIVACY_OPERATOR:-}
        PRIVACY_EMAIL: ${PRIVACY_EMAIL:-}
        PRIVACY_POLICY_REVIEWED: ${PRIVACY_POLICY_REVIEWED:-false}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend-data:
