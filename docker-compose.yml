version: '3.8'

services:
  # -----------------------------------------------
  # MediDesk Backend REST API Service
  # -----------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set a new random JWT_SECRET of at least 32 bytes}
      - FRONTEND_URL=${FRONTEND_URL:?Set the public HTTPS frontend origin}
      - DB_PATH=/home/node/app/data/medidesk-db.json
      - USERS_PATH=/home/node/app/data/users.json
      - TRUST_PROXY=1
    volumes:
      - backend-db-data:/home/node/app/data
    expose:
      - "5000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - medidesk-network

  # -----------------------------------------------
  # MediDesk Frontend Client (Vite + Nginx)
  # -----------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medidesk-network

networks:
  medidesk-network:
    driver: bridge

volumes:
  backend-db-data:
    driver: local
