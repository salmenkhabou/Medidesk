server {
    listen 80;
    server_name localhost;
    client_max_body_size 6m;
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;


    # Gzip compression for high-performance delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    }

    root /usr/share/nginx/html;
    rewrite ^(.+)/$ $1 permanent;
    error_page 404 /404.html;
    location = /404 { return 404; }
    location = / { try_files /index.html =404; }
    location = /404.html { internal; }

    # Dotfiles, dependency manifests and source maps are never public resources.
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:map|sqlite|sqlite3|db|pem|key|env)$ { return 404; }

    # Each known SPA route has generated metadata; unknown paths remain HTTP 404.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html =404;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the single client IP established by our private gateway.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }
}
