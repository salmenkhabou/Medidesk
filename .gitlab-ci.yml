# ==============================================================================
# MediDesk Healthcare Platform - GitLab CI/CD Pipeline
# Security checks do not establish healthcare regulatory compliance
# ==============================================================================

stages:
  - security_audit
  - test
  - docker_build
  - deploy_staging
  - deploy_production

variables:
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  BACKEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/backend:latest"
  FRONTEND_IMAGE_LATEST: "$CI_REGISTRY_IMAGE/frontend:latest"

default:
  interruptible: true

# ------------------------------------------------------------------------------
# 1. SECURITY & VULNERABILITY AUDIT STAGE
# ------------------------------------------------------------------------------
security:audit:
  stage: security_audit
  image: node:22-alpine
  script:
    - echo "🛡️ Running security audit on backend dependencies..."
    - cd backend && npm audit --audit-level=moderate
    - echo "🛡️ Running security audit on frontend dependencies..."
    - cd ../frontend && npm audit --audit-level=moderate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ------------------------------------------------------------------------------
# 2. TEST & BUILD VALIDATION STAGE
# ------------------------------------------------------------------------------
test:frontend_build:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - echo "🧪 Validating React / Vite frontend build..."
    - npm test
    - npm run build
  artifacts:
    name: "medidesk-frontend-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/dist/
    expire_in: 7 days

test:backend_integration:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci --prefer-offline
  script:
    - npm test

# ------------------------------------------------------------------------------
# 3. DOCKER CONTAINERIZATION & REGISTRY PUBLISH STAGE
# ------------------------------------------------------------------------------
docker:build_images:
  stage: docker_build
  image: docker:29.9.2-cli
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  services:
    - name: docker:29.9.2-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "🐳 Building Backend Container..."
    - docker build -t $BACKEND_IMAGE -t $BACKEND_IMAGE_LATEST ./backend
    - echo "🐳 Building Frontend Container..."
    - docker build -t $FRONTEND_IMAGE -t $FRONTEND_IMAGE_LATEST ./frontend
    - echo "🚀 Pushing Docker images to GitLab Container Registry..."
    - docker push $BACKEND_IMAGE
    - docker push $BACKEND_IMAGE_LATEST
    - docker push $FRONTEND_IMAGE
    - docker push $FRONTEND_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ------------------------------------------------------------------------------
# 4. STAGING DEPLOYMENT STAGE (Automated for 'develop' branch)
# ------------------------------------------------------------------------------
deploy:staging:
  stage: deploy_staging
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.medidesk.tn
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - test -n "$SSH_KNOWN_HOSTS"
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to Staging Environment ($STAGING_SERVER_IP)..."
    - |
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_SERVER_IP" "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$STAGING_USER@$STAGING_SERVER_IP" "
        cd /var/www/medidesk &&
        docker pull $BACKEND_IMAGE_LATEST &&
        docker pull $FRONTEND_IMAGE_LATEST &&
        docker compose -f docker-compose.yml up -d --remove-orphans &&
        docker image prune -af
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ------------------------------------------------------------------------------
# 5. PRODUCTION DEPLOYMENT STAGE (Manual Approval Required for 'main' branch)
# ------------------------------------------------------------------------------
deploy:production:
  stage: deploy_production
  image: alpine:latest
  environment:
    name: production
    url: https://medidesk.tn
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - test -n "$SSH_KNOWN_HOSTS"
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying to Production Environment ($PROD_SERVER_IP)..."
    - |
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_SERVER_IP" "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_SERVER_IP" "
        cd /var/www/medidesk &&
        docker pull $BACKEND_IMAGE_LATEST &&
        docker pull $FRONTEND_IMAGE_LATEST &&
        docker compose -f docker-compose.yml up -d --remove-orphans &&
        docker image prune -af
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
